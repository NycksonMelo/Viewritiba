<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evento NOVO</title>
    <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
<main class="page-main">

    <section class="form-container">
        <div class="form-header">
            <h2>Cadastrar Evento</h2>
            <p>Preencha os dados do evento.</p>
        </div>

        <form id="formEvento" class="modern-form">
            <div class="input-group">
                <label for="titulo">Título:</label>
                <input type="text" id="titulo" name="titulo" required>
            </div>
            <div class="input-group">
                <label for="descricao">Descrição:</label>
                <textarea id="descricao" name="descricao" required></textarea>
            </div>
            <div class="input-group">
                <label for="data_hora">Data e Hora:</label>
                <input type="datetime-local" id="data_hora" name="data_hora" required>
            </div>
            <div class="input-group">
                <label for="local">Local:</label>
                <input type="text" id="local" name="local" required>
            </div>
            <button type="submit" id="enviar" class="btn-primary">Cadastrar evento</button>
        </form>
    </section>
</main>
    <script src="../js/evento_novo.js?v=2"></script>
    <script src="../js/valida_sessao.js?v=2"></script>
