<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizar Evento - Viewritiba</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="eventos.css">
</head>
<body>
    <header class="page-header">
        <div class="header-content">
            <h1>Viewritiba</h1>
        </div>
    </header>

    <main class="page-main">
        <section class="event-detail-panel">
            <button type="button" id="btn_voltar">← Voltar</button>
            <div class="form-header" style="margin-bottom: 1rem;">
                <div id="evento_tela" style="margin-top: 1.25rem;"></div>
                <div id="elementos_tela" style="margin-top: 1.25rem;"></div>
            </div>
            
        </section>
    </main>
    <footer>
        <div class="footer-actions">
            <input type="text" id="new_comentario" placeholder="Insira um texto..." class="comment-input">
            <button type="button" id="btn_comentario">Enviar</button>
        </div>
    </footer>
    <script src="js/visualizar_evento.js"></script>
    <script src="js/comentarios.js"></script>
</body>
</html>
