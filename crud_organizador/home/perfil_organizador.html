<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Organizador - Viewritiba</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="perfil_organizador.css">
</head>

<body>
    <!-- Barra Superior de Navegação -->
    <header class="page-header">
        <div class="header-content">
            <a href="index.html" class="brand-link">
                <h1>Viewritiba</h1>
            </a>
            <nav class="header-nav">
                <a href="../../crud_evento/home/eventos.html" class="nav-link">Eventos</a>
                <a href="index.html" class="nav-link">Início</a>
                <a href="../login/Login.html" id="linkLogin" class="nav-link">Login</a>
            </nav>
        </div>
    </header>

    <!-- Área Principal do Perfil (Estilo Instagram) -->
    <main class="profile-page-container">
        
        <!-- Cabeçalho Superior do Perfil -->
        <section class="profile-header">
            <!-- Coluna do Avatar (Inicial do Nome ou Foto) -->
            <div class="avatar-column">
                <div id="avatarContainer" class="avatar-circle">
                    <span id="avatarInicial" class="avatar-initial"></span>
                    <img id="avatarImg" class="avatar-image hidden" alt="Foto de perfil">
                </div>
            </div>

            <!-- Coluna de Informações do Perfil -->
            <div class="info-column">
                <!-- Linha 1: Nome e Botões de Ação do Dono -->
                <div class="user-row">
                    <h2 id="perfilNome" class="username"></h2>
                    <div id="donoActions" class="actions-group hidden">
                        <a href="organizador_alterar.html" id="btnEditarPerfil" class="btn-action">Editar perfil</a>
                        <a href="../../crud_evento/home/evento_add.html" id="btnCriarEvento" class="btn-action btn-action-primary">Novo evento</a>
                    </div>
                </div>

                <!-- Linha 2: Métricas -->
                <div class="stats-row">
                    <div class="stat-entry">
                        <span id="statTotalEventos" class="stat-bold">0</span> eventos
                    </div>
                </div>

                <!-- Linha 3: Biografia (Aparece se preenchida) -->
                <div id="bioContainer" class="bio-row hidden">
                    <p id="perfilBio" class="bio-text"></p>
                </div>

                <!-- Linha 4: Contatos Cadastrados no Banco -->
                <div class="contacts-row">
                    <div id="itemEmail" class="contact-tag hidden">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                        <span id="perfilEmail"></span>
                    </div>

                    <div id="itemTelefone" class="contact-tag hidden">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                        </svg>
                        <span id="perfilTelefone"></span>
                    </div>

                    <div id="itemDocumento" class="contact-tag hidden">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                            <line x1="7" y1="8" x2="17" y2="8"></line>
                        </svg>
                        <span id="perfilDocumento"></span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Divisor e Aba de Eventos -->
        <div class="tabs-divider">
            <div class="tab-button active">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
                <span>EVENTOS</span>
            </div>
        </div>

        <!-- Grade de Eventos -->
        <section class="events-section">
            <div id="gridEventos" class="events-grid">
                <!-- Inserido dinamicamente via JavaScript -->
            </div>

            <!-- Mensagem caso não existam eventos cadastrados -->
            <div id="emptyEventos" class="empty-events hidden">
                <p>Nenhum evento criado ainda.</p>
            </div>
        </section>

    </main>

    <script src="../js/perfil_organizador.js"></script>
</body>

</html>
