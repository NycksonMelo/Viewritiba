<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login do Organizador - Viewritiba</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="organizador_login.css">
</head>

<body>
    <!-- Cabeçalho -->
    <header class="page-header">
        <div class="header-content">
            <h1>Viewritiba</h1>
            <p>Área do Organizador</p>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="page-main">
        <section class="form-container">
            <div class="form-header">
                <h2>Acesse sua conta</h2>
                <p>Preencha seus dados para gerenciar seus eventos.</p>
            </div>

            <form id="formLogin" class="modern-form">
                <div class="input-group">
                    <label for="email">E-mail ou CPF/CNPJ</label>
                    <input type="text" id="email" name="email" placeholder="seu@email.com ou documento" required>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-primary">
                    <span>Entrar</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14"></path>
                        <path d="m12 5 7 7-7 7"></path>
                    </svg>
                </button>

                <div class="form-footer">
                    <p>Não tem uma conta?</p>
                    <a href="../home/organizador_novo.html" class="signup-link">Cadastre-se</a>
                </div>
            </form>
        </section>
    </main>

    <script src="../js/organizador_login.js"></script>
</body>

</html>
