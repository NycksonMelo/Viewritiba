<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos - Viewritiba</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="eventos.css">
</head>
<body>
    <header class="page-header">
        <div class="header-content">
            <h1>Viewritiba</h1>
        </div>
    </header>

    <main class="page-main">
        <section class="eventos-container">
            <div class="form-header">
                <h2 class="eventos-title">Eventos</h2>
            </div>

            <div class="eventos-toolbar">
                <div class="filter-group">
                    <input type="date" id="filtro_data">
                    <button id="filtro_apagar" type="button">Limpar filtro</button>
                </div>
                <button type="button" id="new_evento">Adicionar Evento</button>
            </div>

            <div id="elementos_tela" class="align"></div>
        </section>
    </main>

<script src="js/eventos.js"></script>
</body>
</html>
